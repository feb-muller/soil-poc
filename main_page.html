<!DOCTYPE html>
<html>
    <body>
        <h1>Moisture Sensor Dashboard</h1>
        <select id="drop_val">
            <option value="1">Sensor 1</option>
            <option value="2">Sensor 2</option>
            <option value="3">Sensor 3</option>
        </select>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js">
        </script>

        <canvas id="sensor_chart"></canvas>

        <script>
            document.getElementById("drop_val").addEventListener("change", function () {

                const sensorId = Number(this.value);

                const requestBody = JSON.stringify({
                    drop_val: sensorId
                });

                console.log(requestBody);

                fetch("http://127.0.0.1:8000/data", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: requestBody
                })
                .then(response => {
                    console.log("HTTP status:", response.status);
                    return response.json();
                })
                .then(reading => {
                    console.log("Data from Python:", reading);

                    var moisture_levels = reading[0].map(Number)

                    const sensor_chart = new Chart("sensor_chart", {
                        type: "line",
                        data: {
                            labels: reading[1],
                            datasets: [{
                                label: "Moisture Level",
                                hoverBackgroundColor: "rgba(232,105,90,0.8)",
                                borderColor: "rgba(0,0,255,0.1)",
                                borderWidth: 5,
                                data: moisture_levels
                                }]
                        },
                    });

                })
                .catch(error => {
                    console.error("Error:", error);
                });

            });
 
        </script>
    </body>
</html>
